<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Our Business</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
h1 { margin-bottom: 15px; color: #111; font-size: 24px; }
p { line-height: 1.6; color: #666; margin-bottom: 25px; }
.contact-btn { display: block; background-color: #0070f3; color: white; text-decoration: none; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 16px; transition: background 0.2s; }
.contact-btn:hover { background-color: #0051a8; }
.secondary { background-color: #222; }
.secondary:hover { background-color: #000; }
</style>
</head>
<body>
<div class="card">
<h1>Our Business Name</h1>
<p>Insert your welcoming business description here. Tell your customers exactly what you do, your hours, or any quick details they need to know right now.</p>

<a href="tel:1234567890" class="contact-btn">📞 Call Us: (123) 456-7890</a>
<a href="mailto:info@yourbusiness.com" class="contact-btn secondary">✉️ Email Us</a>
</div>
</body>
</html>
